<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08241F">
<title>RC Web Car · Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --mask: #0F5A4C;
    --mask-deep: #08241F;
    --solder: #D7DCE0;
    --copper: #C98A4B;
    --copper-dim: #7A5634;
    --alarm: #E5484D;
    --ok: #3DDC97;
    font-family: "Saira Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100dvh; display: grid; place-items: center;
    padding: calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    color: var(--solder);
    background:
      radial-gradient(ellipse at 50% 0%, rgba(201,138,75,.18), transparent 55%),
      radial-gradient(circle at 50% 35%, var(--mask) 0, var(--mask-deep) 62%, #041411 100%);
  }
  .card {
    width: min(380px, 100%); display: grid; gap: 18px;
    padding: 30px 24px 26px; border-radius: 22px;
    background: rgba(8, 36, 31, .82); border: 2px solid var(--copper-dim);
    box-shadow: 0 24px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.04);
  }
  .logo { display: grid; justify-items: center; gap: 6px; }
  .logo svg { width: 112px; height: auto; filter: drop-shadow(0 6px 14px rgba(0,0,0,.45)); }
  h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: .4px; text-align: center; }
  .sub { margin: -10px 0 0; text-align: center; font-size: 15px; opacity: .72; }
  form { display: grid; gap: 14px; }
  label { display: grid; gap: 6px; font-size: 14px; font-weight: 700; letter-spacing: .3px; }
  input {
    width: 100%; font: inherit; font-size: 17px; font-weight: 500;
    padding: 11px 14px; border-radius: 12px; outline: none;
    border: 2px solid var(--copper-dim); background: rgba(0,0,0,.35); color: var(--solder);
    transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder { color: rgba(215,220,224,.4); }
  input:focus { border-color: var(--copper); box-shadow: 0 0 0 3px rgba(201,138,75,.25); }
  .pw { position: relative; }
  .pw input { padding-right: 50px; }
  .ojo {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 40px; height: 40px; display: grid; place-items: center;
    border: 0; border-radius: 10px; background: none; color: var(--solder); opacity: .7; cursor: pointer;
  }
  .ojo:hover, .ojo[aria-pressed="true"] { opacity: 1; }
  .ojo svg { width: 22px; height: 22px; }
  .ojo[aria-pressed="false"] .tachado { display: none; }   /* ojo tachado = "ocultar" */
  .entrar {
    margin-top: 4px; font: inherit; font-size: 18px; font-weight: 700; letter-spacing: .4px;
    padding: 12px; border: 0; border-radius: 999px; cursor: pointer; color: #1A1209;
    background: linear-gradient(#E0A466, var(--copper));
    box-shadow: 0 6px 18px rgba(201,138,75,.35);
    transition: transform .1s, filter .15s;
  }
  .entrar:hover { filter: brightness(1.06); }
  .entrar:active { transform: translateY(1px); }
  .entrar:disabled { opacity: .65; cursor: default; }
  .ojo:focus-visible, .entrar:focus-visible { outline: 3px solid var(--solder); outline-offset: 2px; }
  .error { margin: 0; min-height: 1.4em; text-align: center; font-size: 15px; color: var(--alarm); }
  .pie { margin: 0; text-align: center; font-size: 13px; opacity: .5; }
  .shake { animation: shake .35s; }
  @keyframes shake {
    20% { transform: translateX(-8px); } 40% { transform: translateX(7px); }
    60% { transform: translateX(-5px); } 80% { transform: translateX(3px); }
  }
  @media (prefers-reduced-motion: reduce) { .shake { animation: none; } * { transition: none !important; } }
</style>
</head>
<body>
  <main class="card" id="card">
    <div class="logo" aria-hidden="true">
      <!-- Cabeza del robot: dos "prismáticos" con la cámara en medio -->
      <svg viewBox="0 0 120 92" fill="none">
        <path d="M60 4v12" stroke="#C98A4B" stroke-width="3" stroke-linecap="round"/>
        <circle cx="60" cy="4" r="3.5" fill="#C98A4B"/>
        <rect x="8" y="16" width="104" height="58" rx="22" fill="#0F5A4C" stroke="#C98A4B" stroke-width="3"/>
        <circle cx="36" cy="45" r="19" fill="#08241F" stroke="#7A5634" stroke-width="3"/>
        <circle cx="84" cy="45" r="19" fill="#08241F" stroke="#7A5634" stroke-width="3"/>
        <circle cx="36" cy="45" r="10" fill="#3DDC97" opacity=".9"/>
        <circle cx="84" cy="45" r="10" fill="#3DDC97" opacity=".9"/>
        <circle cx="32" cy="41" r="3.5" fill="#fff" opacity=".85"/>
        <circle cx="80" cy="41" r="3.5" fill="#fff" opacity=".85"/>
        <rect x="53" y="38" width="14" height="14" rx="4" fill="#08241F" stroke="#C98A4B" stroke-width="2"/>
        <circle cx="60" cy="45" r="3" fill="#C98A4B"/>
        <path d="M30 74v8M90 74v8" stroke="#7A5634" stroke-width="5" stroke-linecap="round"/>
        <rect x="22" y="82" width="76" height="8" rx="4" fill="#7A5634"/>
      </svg>
      <h1>RC Web Car</h1>
    </div>
    <p class="sub">Entra para conducir</p>
    <form id="form" method="post" action="/login" autocomplete="on" novalidate>
      <label>Usuario
        <input id="usuario" name="username" autocomplete="username" autocapitalize="none"
               spellcheck="false" required>
      </label>
      <label>Contraseña
        <span class="pw">
          <input id="clave" name="password" type="password" autocomplete="current-password" required>
          <button class="ojo" id="ojo" type="button" aria-label="Mostrar contraseña" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
              <path class="tachado" d="M4 4l16 16"/>
            </svg>
          </button>
        </span>
      </label>
      <p class="error" id="error" role="alert"></p>
      <button class="entrar" id="entrar" type="submit">Entrar</button>
    </form>
    <p class="pie">¿No tienes usuario? Pídeselo a quien te ha invitado.</p>
  </main>

<script>
const form = document.getElementById("form"), card = document.getElementById("card");
const usuario = document.getElementById("usuario"), clave = document.getElementById("clave");
const error = document.getElementById("error"), entrar = document.getElementById("entrar");
const ojo = document.getElementById("ojo");

try { usuario.value = localStorage.getItem("rc_usuario") || ""; } catch (e) {}
(usuario.value ? clave : usuario).focus();

ojo.addEventListener("click", () => {
  const ver = clave.type === "password";
  clave.type = ver ? "text" : "password";
  ojo.setAttribute("aria-pressed", ver);
  ojo.setAttribute("aria-label", ver ? "Ocultar contraseña" : "Mostrar contraseña");
  clave.focus();
});

function fallo(msg) {
  error.textContent = msg;
  card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!usuario.value.trim() || !clave.value) { fallo("Escribe tu usuario y tu contraseña"); return; }
  error.textContent = "";
  entrar.disabled = true; entrar.textContent = "Entrando…";
  try {
    const r = await fetch("/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ usuario: usuario.value.trim(), clave: clave.value }),
    });
    const d = await r.json().catch(() => ({}));
    if (d.ok) {
      try { localStorage.setItem("rc_usuario", usuario.value.trim()); } catch (e) {}
      location.replace("/");
      return;
    }
    fallo(d.error || "No se ha podido entrar");
    clave.select();
  } catch (err) {
    fallo("No hay conexión con el coche");
  }
  entrar.disabled = false; entrar.textContent = "Entrar";
});
</script>
</body>
</html>
